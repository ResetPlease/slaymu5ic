name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install FFmpeg
        timeout-minutes: 5
        run: |
          sudo tee /etc/apt/apt.conf.d/80-ci-network > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python dependencies
        timeout-minutes: 3
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --timeout 30 --retries 3 -r requirements-dev.txt
      - name: Install Node dependencies
        timeout-minutes: 3
        run: npm ci --fetch-retries=3 --fetch-timeout=30000
      - name: Install Chromium
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "30000"
        run: |
          npx playwright install --with-deps chromium
      - name: Check source and formatting
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          npm run vendor
          git diff --exit-code -- static/vendor static/fonts
          npm run check
          git diff --check
          python deploy/check_repository.py
      - name: Test API and audio transformations
        run: .venv/bin/python -m pytest -v --cov=slaymusic --cov=app_final --cov-fail-under=90 --cov-report=term-missing
      - name: Test browser workflows
        run: npm run test:e2e
      - name: Package application
        run: git archive --format=tar.gz --output=slaymusic.tar.gz HEAD app_final.py slaymusic static requirements.txt requirements-dev.txt requirements.in requirements-dev.in pyproject.toml test_app.py tests package.json package-lock.json playwright.config.js deploy scripts README.md THIRD_PARTY.md .env.example
      - name: Upload application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: slaymusic-${{ github.sha }}
          path: slaymusic.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Upload browser failure report
        if: ${{ failure() && hashFiles('playwright-report/**', 'test-results/**') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
