location = /slaymusic {
    return 308 /slaymusic/;
}

location ^~ /slaymusic/ {
    limit_conn slaymusic_ip 2;
    limit_conn slaymusic_global 8;
    limit_conn_status 429;
    limit_req zone=slaymusic_rate burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @slaymusic_busy;
    client_max_body_size 30m;
    client_body_buffer_size 16k;
    client_body_timeout 60s;
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 180s;
    proxy_send_timeout 65s;
}

location @slaymusic_busy {
    default_type application/json;
    add_header Retry-After 5 always;
    return 429 '{"detail":"Сервис занят. Повторите через несколько секунд."}';
}
