map "$uri:$request_method" $slaymusic_upload_ip {
    default "";
    ~^/slaymusic/api/.*:POST$ $binary_remote_addr;
}

map "$uri:$request_method" $slaymusic_upload_global {
    default "";
    ~^/slaymusic/api/.*:POST$ slaymusic;
}

limit_conn_zone $slaymusic_upload_ip zone=slaymusic_ip:1m;
limit_conn_zone $slaymusic_upload_global zone=slaymusic_global:1m;
limit_req_zone $slaymusic_upload_ip zone=slaymusic_rate:1m rate=30r/m;
